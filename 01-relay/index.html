<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="icon" href="./brand/relay-mark.svg">
  <title>Relay · 單一資料來源 · 即時工作流</title>
  <link rel="stylesheet" href="./relay.css">
  <link rel="stylesheet" href="./demo.css">
  <script src="./icons.js" defer></script>
  <script src="./demo.js" defer></script>
</head>
<body class="workspace-page-background workspace-background-mist">
  <div class="app-shell workspace-background">
    <aside class="sidebar" aria-label="Relay 導覽">
      <a class="brand" href="#dashboard"><img class="relay-brand-mark" src="./brand/relay-mark.svg" alt=""><span class="relay-wordmark">relay<span class="relay-brand-dot">.</span></span></a>
      <div class="nav-label">Workspace</div>
      <div id="workspace-nav"></div>
      <div class="nav-label">Account</div>
      <a class="nav-link" href="../index.html" aria-label="回作品集" title="回作品集"><span id="back-icon" class="navigation-icon"></span><span>回作品集</span></a>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-caption">單一資料來源 · 即時工作流</div>
        <div class="actions">
          <a class="btn notification-bell" href="#notifications" id="bell" aria-label="通知"></a>
          <a class="btn" href="#search">搜尋</a>
          <button class="btn btn-primary" id="topbar-create" type="button">＋ 建立卡片</button>
          <button type="button" id="account-trigger" class="topbar-user account-trigger" aria-haspopup="menu" aria-expanded="false">
            <span class="topbar-avatar" id="actor-avatar" aria-hidden="true"></span>
            <span class="topbar-user-name" id="actor-name"></span>
            <span id="actor-chevron" class="navigation-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>
      <div class="content" id="screen" aria-label="Relay 工作區"></div>
    </main>
  </div>
  <output id="toast" class="demo-toast" role="status" aria-live="polite" hidden></output>
  <div id="popover-portal"></div>
  <div id="modal-portal"></div>
</body>
</html>
