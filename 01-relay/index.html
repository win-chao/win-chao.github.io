<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <link rel="icon" href="./brand/relay-mark.svg">
  <title>Relay PM · 互動 Demo</title>
  <link rel="stylesheet" href="./relay.css">
  <link rel="stylesheet" href="./demo.css">
  <script src="./icons.js" defer></script>
  <script src="./workspaces.js" defer></script>
  <script src="./relay4.js" defer></script>
  <script src="./demo.js" defer></script>
</head>
<body class="workspace-page-background workspace-background-mist">
  <div class="app-shell workspace-background">
    <aside class="sidebar" aria-label="Relay 導覽">
      <a class="brand" href="#workspaces"><img class="relay-brand-mark" src="./brand/relay-mark.svg" alt=""><span class="relay-wordmark">relay<span class="relay-brand-dot">.</span></span></a>
      <div id="workspace-nav"></div>
      <div class="nav-label">Account</div>
      <a class="nav-link" href="../index.html" aria-label="回作品集" title="回作品集"><span id="back-icon" class="navigation-icon"></span><span>回作品集</span></a>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-caption">單一資料來源 · 即時工作流</div>
        <div class="actions">
          <a class="btn notification-bell" href="#notifications" id="bell" aria-label="通知"></a>
          <button class="btn" id="reset" type="button">重置 Demo</button>
          <label class="topbar-user">
            <span class="topbar-avatar" id="actor-avatar" aria-hidden="true"></span>
            <select id="actor" aria-label="切換展示角色"></select>
          </label>
        </div>
      </header>
      <section class="content board-content" id="screen" aria-label="Relay 工作區"></section>
    </main>
  </div>
  <output id="toast" class="demo-toast" role="status" aria-live="polite" hidden></output>
  <dialog id="create-dialog" class="card modal" aria-labelledby="create-title">
    <form id="create-form">
      <div class="toolbar"><h2 id="create-title">建立卡片</h2><button class="btn" type="button" data-close aria-label="關閉建立卡片">×</button></div>
      <p class="eyebrow" id="create-parent" hidden></p>
      <div class="form-grid">
        <label class="field full">標題<input class="input" name="title" maxlength="100" required></label>
        <label class="field">類型<select class="select" name="type"><option>Task</option><option>Bug</option><option>Story</option></select></label>
        <label class="field">Sprint<select class="select" name="sprint"><option value="sprint">Sprint 24</option><option value="backlog">未排入 Sprint</option></select></label>
        <label class="field">負責人<select class="select" name="maker"></select></label>
        <label class="field">驗收人<select class="select" name="reviewer"></select></label>
      </div>
      <div class="actions dialog-actions"><button type="button" class="btn" data-close>取消</button><button type="submit" class="btn btn-primary">建立卡片</button></div>
    </form>
  </dialog>
</body>
</html>
